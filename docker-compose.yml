# Local development stack: everything except Supabase and Azure Blob, which
# are external managed services configured via .env (see docs/deployment.md).
version: '3.9'

services:
  # Two Redis instances, split by ownership rather than shared wholesale:
  #
  #   redis-shared — auth-service (rate limiting) + ai-storage-service
  #     (scan_progress.py's real-time pipeline-stage checkpoints, plus
  #     anything else ai-storage-service caches). Light, low-throughput
  #     traffic from both.
  #
  #   redis-main   — main-service + worker's BullMQ scan/fix queues, HTTP
  #     cache middleware, rate limiter, and OAuth state. This is the
  #     higher-throughput instance (every scan/fix job round-trips through
  #     it) and scaling/tuning it independently from redis-shared is the
  #     whole point of the split.
  #
  # The one thing that crosses the split: ai-storage-service writes
  # scan:stage:{scanId} to redis-shared as it completes each real pipeline
  # step, and main-service's GET /api/scanner/status/:scanId needs to read
  # that key to show live progress. main-service therefore holds a SECOND,
  # read-mostly connection to redis-shared for exactly that key namespace
  # (see src/config/sharedRedis.js) — its BullMQ/cache/rate-limit traffic
  # never touches redis-shared, and ai-storage-service/auth-service never
  # touch redis-main. See docs/architecture.md § Redis topology.
  redis-shared:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-main:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth_services
    env_file: ./services/auth_services/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis-shared:6379
    ports: ["5000:5000"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis-shared:
        condition: service_healthy

  main-service:
    build: ./services/main_services
    env_file: ./services/main_services/.env
    environment:
      - REDIS_URL=redis://redis-main:6379
      # Read-mostly connection to the OTHER Redis instance, used only to
      # read the scan:stage:{scanId} checkpoint ai-storage-service writes —
      # see src/config/sharedRedis.js. Falls back to REDIS_URL if unset, so
      # a single-Redis deployment (SHARED_REDIS_URL not configured) still
      # works exactly as before the split.
      - SHARED_REDIS_URL=redis://redis-shared:6379
      - AI_STORAGE_SERVICE_URL=http://ai-storage-service:5002
    ports: ["5001:5001"]
    depends_on:
      redis-main:
        condition: service_healthy
      redis-shared:
        condition: service_healthy

  # Standalone BullMQ scan/fix worker(s) — same image as main-service, just a
  # different process (`node src/worker.js` instead of `node src/server.js`,
  # see main_services/package.json's "worker" script). Runs ALONGSIDE
  # main-service's own inline workers (main_services/src/server.js starts
  # them unless DISABLE_INLINE_WORKERS=true) rather than replacing them —
  # BullMQ is built for multiple concurrent consumers on the same queue, so
  # this is real added capacity, not a toggle you have to flip first.
  #
  # Scale it with:
  #   docker compose up --scale worker=4
  # or bump `replicas` below — Compose (not just Swarm) honors `deploy.
  # replicas` for `docker compose up`. Each replica runs its own
  # SCAN_WORKER_CONCURRENCY/FIX_WORKER_CONCURRENCY jobs in parallel, so
  # total throughput is replicas × concurrency, not just concurrency alone.
  # See docs/deployment.md § "Scanner workers as their own scalable
  # service" for the equivalent Azure App Service setup and for guidance
  # on disabling main-service's inline workers once this is deployed.
  worker:
    build: ./services/main_services
    command: ["node", "src/worker.js"]
    env_file: ./services/main_services/.env
    environment:
      - REDIS_URL=redis://redis-main:6379
      - SHARED_REDIS_URL=redis://redis-shared:6379
      - AI_STORAGE_SERVICE_URL=http://ai-storage-service:5002
      - SCAN_WORKER_CONCURRENCY=${SCAN_WORKER_CONCURRENCY:-5}
      - FIX_WORKER_CONCURRENCY=${FIX_WORKER_CONCURRENCY:-4}
    depends_on:
      redis-main:
        condition: service_healthy
      redis-shared:
        condition: service_healthy
    deploy:
      replicas: 2

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-storage-service:
    build: ./services/ai_services
    env_file: ./services/ai_services/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis-shared:6379
      - ES_URL=http://elasticsearch:9200
    ports: ["5002:5002"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis-shared:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_AUTH_API_URL=http://localhost:5000
      - NEXT_PUBLIC_MAIN_API_URL=http://localhost:5001
    ports: ["3000:3000"]
    depends_on:
      - auth-service
      - main-service
      - ai-storage-service

volumes:
  mongo-data:
  es-data:
